{% extends "index.html" %}

{% block content %}

    {% for song in results %}

        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://www.youtube.com/watch?v={{song.video_id}}">
                <img src="{{song.get("thumbnail")[-1].get("url")}}" alt="{{song.title}}">
                </a>
                <div class="title">{{song.title}}</div>
            </div>
        </div>

   

        <div class="clearfix"></div>


    {% endfor %}


{% endblock %}
